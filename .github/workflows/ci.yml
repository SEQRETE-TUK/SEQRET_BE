name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.21"

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check patch integrity
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          else
            git show --check --format= HEAD
          fi

      - name: Reject conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':(exclude)uv.lock'; then
            echo "Unresolved conflict markers found." >&2
            exit 1
          fi

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: seqret_test
          POSTGRES_PASSWORD: seqret_test_password
          POSTGRES_USER: seqret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seqret -d seqret_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SEQRET_TEST_DATABASE_URL: postgresql+psycopg://seqret:seqret_test_password@127.0.0.1:5432/seqret_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install managed Python
        run: uv python install

      - name: Synchronize frozen environment
        run: uv sync --frozen --all-groups

      - name: Check lockfile and dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv pip check

      - name: Run lint and format checks
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Run strict type checks
        run: uv run --frozen mypy

      - name: Verify the Alembic revision graph
        run: uv run --frozen alembic heads --verbose

      - name: Run tests and coverage gates
        run: uv run --frozen pytest

      - name: Build distribution artifacts
        run: uv build --out-dir "${RUNNER_TEMP}/dist"

  terraform-quality:
    name: Terraform quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < infrastructure/terraform/.terraform-version)" >> "${GITHUB_OUTPUT}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=infrastructure/terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=infrastructure/terraform validate

      - name: Test Terraform deployment invariants
        run: terraform -chdir=infrastructure/terraform test

  container-quality:
    name: Container quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production container
        run: docker build --tag seqret-backend:test .

      - name: Verify non-root runtime and health endpoint
        shell: bash
        run: |
          set -euo pipefail
          configured_user="$(docker image inspect seqret-backend:test --format '{{.Config.User}}')"
          configured_uid="${configured_user%%:*}"
          if [[ "${configured_uid}" == "" || "${configured_uid}" == "0" || "${configured_uid}" == "root" ]]; then
            echo "Runtime image must configure a non-root user." >&2
            exit 1
          fi
          container_id="$(docker run --detach --publish 127.0.0.1::8080 seqret-backend:test)"
          trap 'docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT
          host_port="$(docker port "${container_id}" 8080/tcp | awk -F: '{print $NF}')"
          for attempt in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 --fail --silent \
              "http://127.0.0.1:${host_port}/healthz" > health.json \
              && curl --connect-timeout 2 --max-time 5 --fail --silent \
                "http://127.0.0.1:${host_port}/edgez" > edge.json; then break; fi
            sleep 1
          done
          jq -e '.status == "ok" and .runtime == "api"' health.json
          jq -e '.status == "ok" and .runtime == "api"' edge.json
