name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.21"

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check patch integrity
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          else
            git show --check --format= HEAD
          fi

      - name: Reject conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':(exclude)uv.lock'; then
            echo "Unresolved conflict markers found." >&2
            exit 1
          fi

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Python project
        id: python-project
        shell: bash
        run: |
          if [[ -f pyproject.toml && -f uv.lock && -f .python-version ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up uv
        if: steps.python-project.outputs.present == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install managed Python
        if: steps.python-project.outputs.present == 'true'
        run: uv python install

      - name: Synchronize frozen environment
        if: steps.python-project.outputs.present == 'true'
        run: uv sync --frozen --all-groups

      - name: Check lockfile and dependencies
        if: steps.python-project.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv pip check

      - name: Run lint and format checks
        if: steps.python-project.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Run strict type checks
        if: steps.python-project.outputs.present == 'true'
        run: uv run --frozen mypy

      - name: Run tests and coverage gates
        if: steps.python-project.outputs.present == 'true'
        run: uv run --frozen pytest

      - name: Build distribution artifacts
        if: steps.python-project.outputs.present == 'true'
        run: uv build --out-dir "${RUNNER_TEMP}/dist"

      - name: Explain skipped Python checks
        if: steps.python-project.outputs.present != 'true'
        run: echo "Python project files are not present on this branch." >> "${GITHUB_STEP_SUMMARY}"

  terraform-quality:
    name: Terraform quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Terraform root
        id: terraform-project
        shell: bash
        run: |
          if [[ -f infrastructure/terraform/versions.tf && -f infrastructure/terraform/.terraform-version ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
            echo "version=$(tr -d '\r\n' < infrastructure/terraform/.terraform-version)" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Terraform
        if: steps.terraform-project.outputs.present == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-project.outputs.version }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        if: steps.terraform-project.outputs.present == 'true'
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        if: steps.terraform-project.outputs.present == 'true'
        run: terraform -chdir=infrastructure/terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        if: steps.terraform-project.outputs.present == 'true'
        run: terraform -chdir=infrastructure/terraform validate

      - name: Test Terraform deployment invariants
        if: steps.terraform-project.outputs.present == 'true'
        run: terraform -chdir=infrastructure/terraform test

      - name: Explain skipped Terraform checks
        if: steps.terraform-project.outputs.present != 'true'
        run: echo "Terraform project files are not present on this branch." >> "${GITHUB_STEP_SUMMARY}"
