name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ROOT: infrastructure/terraform
  TF_STATE_PREFIX: seqret/staging
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
  API_DOMAIN: ${{ vars.API_DOMAIN }}
  FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
  MEDIA_BUCKET_NAME: ${{ vars.MEDIA_BUCKET_NAME }}
  MIGRATION_DATABASE_URL_SECRET_ID: ${{ vars.MIGRATION_DATABASE_URL_SECRET_ID }}
  API_DATABASE_URL_SECRET_ID: ${{ vars.API_DATABASE_URL_SECRET_ID }}
  WORKER_DATABASE_URL_SECRET_ID: ${{ vars.WORKER_DATABASE_URL_SECRET_ID }}
  OUTBOX_RELAY_DATABASE_URL_SECRET_ID: ${{ vars.OUTBOX_RELAY_DATABASE_URL_SECRET_ID }}
  RECOVERY_DATABASE_URL_SECRET_ID: ${{ vars.RECOVERY_DATABASE_URL_SECRET_ID }}
  CLOUD_SQL_SOURCE_INSTANCE: ${{ vars.CLOUD_SQL_SOURCE_INSTANCE }}
  MEDIA_RETENTION_DAYS: ${{ vars.MEDIA_RETENTION_DAYS }}
  REDIS_URL_SECRET_ID: ${{ vars.REDIS_URL_SECRET_ID }}
  REDIS_VPC_NETWORK: ${{ vars.REDIS_VPC_NETWORK }}
  REDIS_VPC_SUBNETWORK: ${{ vars.REDIS_VPC_SUBNETWORK }}
  MONITORING_NOTIFICATION_CHANNELS: ${{ vars.MONITORING_NOTIFICATION_CHANNELS }}
  CANARY_PERCENT: "10"
  SERVICE: seqret-stg-api
  MIGRATION_JOB: seqret-stg-migrate
  OUTBOX_RELAY_JOB: seqret-stg-relay

jobs:
  deploy:
    name: Build, migrate, and roll out staging
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: staging
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Staging deployments must run from main." >&2
            exit 1
          fi
          git fetch --quiet origin main:refs/remotes/origin/main
          source_sha="$(git rev-parse HEAD)"
          if [[ "${source_sha}" != "$(git rev-parse origin/main)" ]]; then
            echo "The checked-out commit must be the current origin/main commit." >&2
            exit 1
          fi
          echo "SOURCE_SHA=${source_sha}" >> "${GITHUB_ENV}"
          required_variables=(
            GCP_PROJECT_ID
            GCP_REGION
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_DEPLOY_SERVICE_ACCOUNT
            TF_STATE_BUCKET
            ARTIFACT_REPOSITORY
            API_DOMAIN
            FRONTEND_ORIGIN
            MEDIA_BUCKET_NAME
            MIGRATION_DATABASE_URL_SECRET_ID
            API_DATABASE_URL_SECRET_ID
            WORKER_DATABASE_URL_SECRET_ID
            OUTBOX_RELAY_DATABASE_URL_SECRET_ID
            RECOVERY_DATABASE_URL_SECRET_ID
            CLOUD_SQL_SOURCE_INSTANCE
            MEDIA_RETENTION_DAYS
            MONITORING_NOTIFICATION_CHANNELS
          )
          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Required staging variable ${variable_name} is not configured." >&2
              exit 1
            fi
          done
          if [[ ! "${ARTIFACT_REPOSITORY}" =~ ^[a-z][a-z0-9-]{0,61}[a-z0-9]$ ]]; then
            echo "ARTIFACT_REPOSITORY is invalid." >&2
            exit 1
          fi
          if [[ ! "${API_DOMAIN}" =~ ^[a-z0-9.-]+\.[a-z0-9-]+$ ]]; then
            echo "API_DOMAIN must be a lowercase fully-qualified DNS name." >&2
            exit 1
          fi
          if [[ ! "${FRONTEND_ORIGIN}" =~ ^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*\.[a-z]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "FRONTEND_ORIGIN must be one canonical HTTPS origin without a port or path." >&2
            exit 1
          fi
          if [[ ! "${MEDIA_BUCKET_NAME}" =~ ^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$ ]]; then
            echo "MEDIA_BUCKET_NAME must be a 3 to 63 character lowercase Cloud Storage bucket name." >&2
            exit 1
          fi
          database_secret_variables=(
            MIGRATION_DATABASE_URL_SECRET_ID
            API_DATABASE_URL_SECRET_ID
            WORKER_DATABASE_URL_SECRET_ID
            OUTBOX_RELAY_DATABASE_URL_SECRET_ID
            RECOVERY_DATABASE_URL_SECRET_ID
          )
          # Seed with an invalid Secret ID so nounset-safe Bash versions can iterate.
          database_secret_ids=("/")
          for variable_name in "${database_secret_variables[@]}"; do
            secret_id="${!variable_name}"
            if [[ ! "${secret_id}" =~ ^[A-Za-z0-9_-]{1,255}$ ]]; then
              echo "${variable_name} is invalid." >&2
              exit 1
            fi
            for configured_secret_id in "${database_secret_ids[@]}"; do
              if [[ "${secret_id}" == "${configured_secret_id}" ]]; then
                echo "Database Secret IDs must be distinct; ${variable_name} is duplicated." >&2
                exit 1
              fi
            done
            database_secret_ids+=("${secret_id}")
          done
          if [[ ! "${CLOUD_SQL_SOURCE_INSTANCE}" =~ ^[a-z]([a-z0-9-]{0,96}[a-z0-9])?$ ]]; then
            echo "CLOUD_SQL_SOURCE_INSTANCE is invalid." >&2
            exit 1
          fi
          if [[ ! "${MEDIA_RETENTION_DAYS}" =~ ^[1-9][0-9]{0,3}$ ]] || \
            (( 10#${MEDIA_RETENTION_DAYS} > 3650 )); then
            echo "MEDIA_RETENTION_DAYS must be a whole number from 1 through 3650." >&2
            exit 1
          fi
          if [[ -n "${REDIS_URL_SECRET_ID}" || -n "${REDIS_VPC_NETWORK}" || -n "${REDIS_VPC_SUBNETWORK}" ]] && \
            [[ -z "${REDIS_URL_SECRET_ID}" || -z "${REDIS_VPC_NETWORK}" || -z "${REDIS_VPC_SUBNETWORK}" ]]; then
            echo "REDIS_URL_SECRET_ID, REDIS_VPC_NETWORK, and REDIS_VPC_SUBNETWORK must be configured together." >&2
            exit 1
          fi
          IFS=',' read -ra channels <<< "${MONITORING_NOTIFICATION_CHANNELS}"
          for channel in "${channels[@]}"; do
            if [[ ! "${channel}" =~ ^projects/[^/]+/notificationChannels/[0-9]+$ ]]; then
              echo "MONITORING_NOTIFICATION_CHANNELS contains an invalid resource name." >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify external bootstrap APIs
        shell: bash
        run: |
          set -euo pipefail
          required_api="cloudresourcemanager.googleapis.com"
          enabled_api="$(gcloud services list \
            --project "${GCP_PROJECT_ID}" \
            --enabled \
            --filter="config.name=${required_api}" \
            --format='value(config.name)')"
          if [[ "${enabled_api}" != "${required_api}" ]]; then
            echo "Cloud Resource Manager API must be enabled before deployment." >&2
            exit 1
          fi

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < "${TF_ROOT}/.terraform-version")" >> "${GITHUB_OUTPUT}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Initialize and validate Terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_ROOT}" init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=${TF_STATE_PREFIX}"
          terraform -chdir="${TF_ROOT}" fmt -check -recursive
          terraform -chdir="${TF_ROOT}" validate

      - name: Bootstrap APIs and Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          placeholder_image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/api@sha256:$(printf '0%.0s' {1..64})"
          terraform -chdir="${TF_ROOT}" apply \
            -lock-timeout=5m \
            -auto-approve \
            -target=google_artifact_registry_repository.backend \
            -var="project_id=${GCP_PROJECT_ID}" \
            -var="region=${GCP_REGION}" \
            -var="environment=staging" \
            -var="api_domain=${API_DOMAIN}" \
            -var="frontend_origin=${FRONTEND_ORIGIN}" \
            -var="media_bucket_name=${MEDIA_BUCKET_NAME}" \
            -var="artifact_repository_id=${ARTIFACT_REPOSITORY}" \
            -var="container_image=${placeholder_image}" \
            -var="cloud_sql_instance_id=${CLOUD_SQL_SOURCE_INSTANCE}" \
            -var="api_max_instances=2" \
            -var="database_connection_alert_threshold=18" \
            -var="media_retention_days=${MEDIA_RETENTION_DAYS}"

      - name: Build and publish immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          image_tag="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/api:${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "${image_tag}" \
            .
          docker push "${image_tag}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${image_tag}")"
          expected_prefix="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/api@sha256:"
          if [[ "${digest}" != "${expected_prefix}"* ]] || [[ ! "${digest}" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "Published image did not resolve to the expected immutable digest." >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Wait for Artifact Analysis and enforce vulnerability policy
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          scan_json="${RUNNER_TEMP}/artifact-vulnerability-scan.json"
          scan_error="${RUNNER_TEMP}/artifact-vulnerability-scan-error.txt"
          scan_status=""
          for attempt in {1..60}; do
            if gcloud artifacts docker images describe "${IMAGE_DIGEST}" \
              --show-package-vulnerability \
              --format=json > "${scan_json}.tmp" 2> "${scan_error}"; then
              scan_status="$(jq -r '
                [.discovery_summary.discovery[]?
                  | select((.noteName // "") | endswith("/PACKAGE_VULNERABILITY"))
                  | .discovery.analysisStatus]
                | first // ""
              ' "${scan_json}.tmp")"
              case "${scan_status}" in
                FINISHED_SUCCESS)
                  mv "${scan_json}.tmp" "${scan_json}"
                  break
                  ;;
                FINISHED_*)
                  echo "Artifact Analysis ended with ${scan_status}." >&2
                  exit 1
                  ;;
              esac
            elif grep -qiE 'permission.denied|permission denied|HTTPError 403' "${scan_error}"; then
              echo "The deployment identity cannot read Artifact Analysis occurrences." >&2
              exit 1
            fi
            if (( attempt == 60 )); then
              echo "Artifact Analysis did not finish within 15 minutes." >&2
              exit 1
            fi
            sleep 15
          done

          set +e
          python3 scripts/check_artifact_vulnerabilities.py \
            --scan "${scan_json}" \
            --exceptions infrastructure/artifact_vulnerability_exceptions.json \
            | tee "${RUNNER_TEMP}/artifact-vulnerability-policy.md"
          policy_status="${PIPESTATUS[0]}"
          set -e
          cat "${RUNNER_TEMP}/artifact-vulnerability-policy.md" >> "${GITHUB_STEP_SUMMARY}"
          exit "${policy_status}"

      - name: Discover the stable revision
        id: stable
        shell: bash
        run: |
          set -euo pipefail
          if edge_action="$(gcloud compute security-policies rules describe 2147483647 \
            --security-policy "${SERVICE}-armor" \
            --project "${GCP_PROJECT_ID}" \
            --format='value(action)' 2>"${RUNNER_TEMP}/edge-error")"; then
            if [[ "${edge_action}" != "allow" && "${edge_action}" != "deny(502)" ]]; then
              echo "The existing Cloud Armor default rule has an unexpected action." >&2
              exit 1
            fi
          elif grep -qiE '(was )?not found|notFound|HTTPError 404' "${RUNNER_TEMP}/edge-error"; then
            edge_action=""
          else
            cat "${RUNNER_TEMP}/edge-error" >&2
            exit 1
          fi
          if [[ "${edge_action}" == "allow" ]]; then
            echo "public_traffic_enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "public_traffic_enabled=false" >> "${GITHUB_OUTPUT}"
          fi
          existing="$(gcloud run services list \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --filter="metadata.name=${SERVICE}" \
            --format='value(metadata.name)')"
          if [[ -z "${existing}" ]]; then
            echo "revision=" >> "${GITHUB_OUTPUT}"
            echo "readiness_contract=" >> "${GITHUB_OUTPUT}"
            echo "rollback_target=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          service_json="$(gcloud run services describe "${SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          stable="$(jq -r '[.status.traffic[] | select(.percent == 100) | .revisionName][0] // empty' \
            <<< "${service_json}")"
          if [[ ! "${stable}" =~ ^seqret-stg-api-[a-z0-9-]+$ ]]; then
            echo "The existing service has no single stable revision at 100 percent traffic." >&2
            exit 1
          fi
          ready="$(gcloud run revisions describe "${stable}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json \
            | jq -r '[.status.conditions[] | select(.type == "Ready") | .status][0] // empty')"
          if [[ "${ready}" != "True" ]]; then
            echo "The stable revision is not ready." >&2
            exit 1
          fi
          readiness_contract="$(gcloud run revisions describe "${stable}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(metadata.labels.readiness_contract)')"
          rollback_target="$(jq -r '[.status.traffic[] | select(.tag == "rollback-target") | .revisionName][0] // empty' \
            <<< "${service_json}")"
          echo "revision=${stable}" >> "${GITHUB_OUTPUT}"
          echo "readiness_contract=${readiness_contract}" >> "${GITHUB_OUTPUT}"
          echo "rollback_target=${rollback_target}" >> "${GITHUB_OUTPUT}"

      - name: Discard stale rollback target
        if: steps.stable.outputs.rollback_target != ''
        shell: bash
        run: >-
          gcloud run services update-traffic "${SERVICE}"
          --project "${GCP_PROJECT_ID}"
          --region "${GCP_REGION}"
          --remove-tags rollback-target
          --quiet

      - name: Deploy and execute the migration gate
        shell: bash
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          terraform_variables=(
            -var="project_id=${GCP_PROJECT_ID}"
            -var="region=${GCP_REGION}"
            -var="environment=staging"
            -var="api_domain=${API_DOMAIN}"
            -var="frontend_origin=${FRONTEND_ORIGIN}"
            -var="media_bucket_name=${MEDIA_BUCKET_NAME}"
            -var="artifact_repository_id=${ARTIFACT_REPOSITORY}"
            -var="container_image=${CONTAINER_IMAGE}"
            -var="migration_database_url_secret_id=${MIGRATION_DATABASE_URL_SECRET_ID}"
            -var="api_database_url_secret_id=${API_DATABASE_URL_SECRET_ID}"
            -var="worker_database_url_secret_id=${WORKER_DATABASE_URL_SECRET_ID}"
            -var="outbox_relay_database_url_secret_id=${OUTBOX_RELAY_DATABASE_URL_SECRET_ID}"
            -var="cloud_sql_instance_id=${CLOUD_SQL_SOURCE_INSTANCE}"
            -var="api_max_instances=2"
            -var="database_connection_alert_threshold=18"
            -var="media_retention_days=${MEDIA_RETENTION_DAYS}"
            -var="otel_trace_sample_ratio=1"
          )
          if [[ -n "${REDIS_URL_SECRET_ID}" ]]; then
            terraform_variables+=("-var=redis_url_secret_id=${REDIS_URL_SECRET_ID}")
          fi
          if [[ -n "${REDIS_VPC_NETWORK}" ]]; then
            terraform_variables+=(
              "-var=redis_vpc_network=${REDIS_VPC_NETWORK}"
              "-var=redis_vpc_subnetwork=${REDIS_VPC_SUBNETWORK}"
            )
          fi
          terraform -chdir="${TF_ROOT}" apply \
            -lock-timeout=5m \
            -auto-approve \
            -target=google_cloud_run_v2_job.migration \
            "${terraform_variables[@]}"
          gcloud run jobs execute "${MIGRATION_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --wait

      - name: Create a migration-approved deployment plan
        shell: bash
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.digest }}
          PUBLIC_TRAFFIC_ENABLED: ${{ steps.stable.outputs.public_traffic_enabled }}
          STABLE_REVISION: ${{ steps.stable.outputs.revision }}
        run: |
          set -euo pipefail
          IFS=',' read -ra channels <<< "${MONITORING_NOTIFICATION_CHANNELS}"
          channels_json="$(printf '%s\n' "${channels[@]}" | jq -R . | jq -s -c .)"
          terraform_variables=(
            -var="project_id=${GCP_PROJECT_ID}"
            -var="region=${GCP_REGION}"
            -var="environment=staging"
            -var="api_domain=${API_DOMAIN}"
            -var="frontend_origin=${FRONTEND_ORIGIN}"
            -var="media_bucket_name=${MEDIA_BUCKET_NAME}"
            -var="artifact_repository_id=${ARTIFACT_REPOSITORY}"
            -var="container_image=${CONTAINER_IMAGE}"
            -var="migration_database_url_secret_id=${MIGRATION_DATABASE_URL_SECRET_ID}"
            -var="api_database_url_secret_id=${API_DATABASE_URL_SECRET_ID}"
            -var="worker_database_url_secret_id=${WORKER_DATABASE_URL_SECRET_ID}"
            -var="outbox_relay_database_url_secret_id=${OUTBOX_RELAY_DATABASE_URL_SECRET_ID}"
            -var="cloud_sql_instance_id=${CLOUD_SQL_SOURCE_INSTANCE}"
            -var="api_max_instances=2"
            -var="database_connection_alert_threshold=18"
            -var="media_retention_days=${MEDIA_RETENTION_DAYS}"
            -var="monitoring_notification_channel_ids=${channels_json}"
            -var="otel_trace_sample_ratio=1"
            -var="public_traffic_enabled=${PUBLIC_TRAFFIC_ENABLED}"
          )
          if [[ -n "${REDIS_URL_SECRET_ID}" ]]; then
            terraform_variables+=("-var=redis_url_secret_id=${REDIS_URL_SECRET_ID}")
          fi
          if [[ -n "${REDIS_VPC_NETWORK}" ]]; then
            terraform_variables+=(
              "-var=redis_vpc_network=${REDIS_VPC_NETWORK}"
              "-var=redis_vpc_subnetwork=${REDIS_VPC_SUBNETWORK}"
            )
          fi
          if [[ -n "${STABLE_REVISION}" ]]; then
            terraform_variables+=("-var=stable_api_revision=${STABLE_REVISION}")
          fi
          state_json="$(terraform -chdir="${TF_ROOT}" show -json)"
          job_runtime="$(jq -c '
            ([.values.root_module.resources[]?
              | select(.type == "google_cloud_run_v2_job" and .name == "job")][0]
              | .values.template[0].template[0].containers[0]) as $runtime
            | if $runtime == null then empty
              elif (($runtime.command // []) | length) == 0
                then error("The existing media-job runtime has no explicit entrypoint.")
              else {
                container_image: $runtime.image,
                command: $runtime.command,
                args: ($runtime.args // [])
              }
              end' <<< "${state_json}")"
          if [[ -n "${job_runtime}" ]]; then
            terraform_variables+=("-var=job_runtime=${job_runtime}")
          fi
          terraform -chdir="${TF_ROOT}" plan \
            -lock-timeout=5m \
            -out="${RUNNER_TEMP}/staging.tfplan" \
            "${terraform_variables[@]}"

      - name: Apply the migration-approved plan
        run: >-
          terraform -chdir="${TF_ROOT}" apply
          -lock-timeout=5m
          -auto-approve
          "${RUNNER_TEMP}/staging.tfplan"

      - name: Verify the scheduled Outbox relay
        shell: bash
        timeout-minutes: 8
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          latest_execution() {
            gcloud run jobs executions list \
              --job "${OUTBOX_RELAY_JOB}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --limit 1 \
              --format=json \
              | jq -r '.[0].metadata.name // .[0].name // empty'
          }

          baseline_execution="$(latest_execution)"
          expected_creator="seqret-stg-cron@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          execution=""
          last_observation="none"
          deadline=$((SECONDS + 420))

          while (( SECONDS < deadline )); do
            if [[ -z "${execution}" ]]; then
              candidate="$(latest_execution)"
              if [[ -z "${candidate}" || "${candidate}" == "${baseline_execution}" ]]; then
                sleep 5
                continue
              fi
              execution="${candidate}"
            fi

            execution_json="$(gcloud run jobs executions describe "${execution}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --format=json)"
            creator="$(jq -r '
              .metadata.annotations["run.googleapis.com/creator"]
              // .creator // empty
            ' <<< "${execution_json}")"
            image="$(jq -r '
              .spec.template.spec.containers[0].image
              // .template.containers[0].image // empty
            ' <<< "${execution_json}")"
            last_observation="execution=${execution},creator=${creator:-missing},image=${image:-missing}"
            if [[ "${creator}" != "${expected_creator}" || "${image}" != "${CONTAINER_IMAGE}" ]]; then
              execution=""
              sleep 5
              continue
            fi
            state="$(jq -r '
              [((.status.conditions // .conditions // [])[])
                | select(.type == "Completed")][0] as $condition
              | $condition.status // $condition.state // empty
            ' <<< "${execution_json}")"
            last_observation="${last_observation},state=${state:-pending}"

            case "${state}" in
              True|CONDITION_SUCCEEDED)
                echo "- Scheduled Outbox relay execution: ${execution##*/} (succeeded)" \
                  >> "${GITHUB_STEP_SUMMARY}"
                exit 0
                ;;
              False|CONDITION_FAILED)
                echo "The scheduled Outbox relay execution failed (${last_observation})." >&2
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "The scheduled Outbox relay did not complete successfully within seven minutes (${last_observation})." >&2
          exit 1

      - name: Verify the new revision
        id: revision
        shell: bash
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.digest }}
          PUBLIC_TRAFFIC_ENABLED: ${{ steps.stable.outputs.public_traffic_enabled }}
          STABLE_REVISION: ${{ steps.stable.outputs.revision }}
        run: |
          set -euo pipefail
          revision="$(gcloud run services describe "${SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(status.latestReadyRevisionName)')"
          if [[ -z "${revision}" ]]; then
            echo "Cloud Run did not report a ready revision." >&2
            exit 1
          fi
          deployed_image="$(gcloud run revisions describe "${revision}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(spec.containers[0].image)')"
          if [[ "${deployed_image}" != "${CONTAINER_IMAGE}" ]]; then
            echo "The new revision does not use the published image digest." >&2
            exit 1
          fi
          if [[ "${revision}" == "${STABLE_REVISION}" && "${PUBLIC_TRAFFIC_ENABLED}" == "true" ]]; then
            echo "Cloud Run did not create a new ready revision." >&2
            exit 1
          fi
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Verify the public edge and database readiness
        shell: bash
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.digest }}
          NEW_REVISION: ${{ steps.revision.outputs.revision }}
          PUBLIC_TRAFFIC_ENABLED: ${{ steps.stable.outputs.public_traffic_enabled }}
          READINESS_CONTRACT: ${{ steps.stable.outputs.readiness_contract }}
          STABLE_REVISION: ${{ steps.stable.outputs.revision }}
        run: |
          set -euo pipefail
          load_balancer_ip="$(terraform -chdir="${TF_ROOT}" output -raw api_load_balancer_ip)"
          certificate_name="$(terraform -chdir="${TF_ROOT}" output -raw api_managed_certificate_name)"
          expected_revision="${STABLE_REVISION:-${NEW_REVISION}}"
          probe_path="readyz"
          if [[ -n "${STABLE_REVISION}" && "${READINESS_CONTRACT}" != "v1" ]]; then
            probe_path="healthz"
            expected_revision=""
          fi
          {
            echo "### Public edge"
            echo "- DNS name: ${API_DOMAIN}"
            echo "- DNS target: ${load_balancer_ip}"
          } >> "${GITHUB_STEP_SUMMARY}"
          ready=0
          for _ in {1..30}; do
            certificate_status="$(gcloud compute ssl-certificates describe "${certificate_name}" \
              --project "${GCP_PROJECT_ID}" --global \
              --format='value(managed.status)' 2>/dev/null || true)"
            response="$(curl --connect-timeout 2 --max-time 3 --fail --silent --show-error \
              "https://${API_DOMAIN}/${probe_path}" 2>/dev/null || true)"
            healthy="$(jq -r 'select(.status == "ok" and .runtime == "api") | true' \
              <<< "${response}" 2>/dev/null || true)"
            revision="$(jq -r 'select(.status == "ok" and .runtime == "api") | .revision // empty' \
              <<< "${response}" 2>/dev/null || true)"
            if [[ "${certificate_status}" == "ACTIVE" && "${healthy}" == "true" \
              && ( -z "${expected_revision}" || "${revision}" == "${expected_revision}" ) ]]; then
              ready=1
              break
            fi
            sleep 10
          done
          if (( ready == 0 )); then
            echo "The managed certificate, public edge, or database readiness check did not become healthy." >&2
            echo "Point ${API_DOMAIN} at ${load_balancer_ip}, then rerun this workflow." >&2
            exit 1
          fi

      - name: Health-check the canary and promote it
        if: steps.stable.outputs.revision != '' && steps.revision.outputs.revision != steps.stable.outputs.revision
        shell: bash
        timeout-minutes: 15
        env:
          NEW_REVISION: ${{ steps.revision.outputs.revision }}
          READINESS_CONTRACT: ${{ steps.stable.outputs.readiness_contract }}
          STABLE_REVISION: ${{ steps.stable.outputs.revision }}
        run: |
          set -euo pipefail
          rollback_tag_args=()
          if [[ "${READINESS_CONTRACT}" == "v1" ]]; then
            rollback_tag_args=(--update-tags "rollback-target=${STABLE_REVISION}")
          fi
          restore_stable() {
            gcloud run services update-traffic "${SERVICE}" \
              --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
              --to-revisions "${STABLE_REVISION}=100" --quiet \
              || echo "Failed to restore stable traffic." >&2
            current_target="$(gcloud run services describe "${SERVICE}" \
              --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format=json \
              | jq -r '[.status.traffic[] | select(.tag == "rollback-target") | .revisionName][0] // empty' \
              2>/dev/null || true)"
            if [[ -n "${current_target}" ]]; then
              gcloud run services update-traffic "${SERVICE}" \
                --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
                --remove-tags rollback-target --quiet \
                || echo "Failed to discard the stale rollback target." >&2
            fi
          }
          trap restore_stable EXIT
          stable_percent=$((100 - CANARY_PERCENT))
          gcloud run services update-traffic "${SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --to-revisions "${STABLE_REVISION}=${stable_percent},${NEW_REVISION}=${CANARY_PERCENT}" \
            "${rollback_tag_args[@]}" \
            --quiet
          canary_successes=0
          for _ in {1..150}; do
            response="$(curl --connect-timeout 2 --max-time 3 --fail --silent --show-error \
              "https://${API_DOMAIN}/readyz" 2>/dev/null || true)"
            revision="$(jq -r 'select(.status == "ok" and .runtime == "api") | .revision // empty' \
              <<< "${response}" 2>/dev/null || true)"
            if [[ "${revision}" == "${NEW_REVISION}" ]]; then
              canary_successes=$((canary_successes + 1))
              if (( canary_successes == 5 )); then break; fi
            fi
            sleep 1
          done
          if (( canary_successes < 5 )); then
            echo "The new revision did not pass five public canary readiness checks." >&2
            exit 1
          fi
          gcloud run services update-traffic "${SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --to-revisions "${NEW_REVISION}=100" \
            "${rollback_tag_args[@]}" \
            --quiet
          promoted="$(gcloud run services describe "${SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json \
            | jq -r '[.status.traffic[] | select((.percent // 0) == 100) | .revisionName][0] // empty')"
          if [[ "${promoted}" != "${NEW_REVISION}" ]]; then
            echo "Cloud Run did not confirm the promoted revision." >&2
            exit 1
          fi
          promoted_healthy=0
          for _ in {1..20}; do
            response="$(curl --connect-timeout 2 --max-time 3 --fail --silent --show-error \
              "https://${API_DOMAIN}/readyz" 2>/dev/null || true)"
            promoted_revision="$(jq -r 'select(.status == "ok" and .runtime == "api") | .revision // empty' \
              <<< "${response}" 2>/dev/null || true)"
            if [[ "${promoted_revision}" == "${NEW_REVISION}" ]]; then
              promoted_healthy=1
              break
            fi
            sleep 2
          done
          if (( promoted_healthy == 0 )); then
            echo "The promoted revision failed its public health check." >&2
            exit 1
          fi
          rollback_target="$(gcloud run services describe "${SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format=json \
            | jq -r '[.status.traffic[] | select(.tag == "rollback-target") | .revisionName][0] // empty')"
          if [[ "${READINESS_CONTRACT}" == "v1" && "${rollback_target}" != "${STABLE_REVISION}" ]]; then
            echo "Cloud Run did not record the previous stable revision as the rollback target." >&2
            exit 1
          fi
          if [[ "${READINESS_CONTRACT}" != "v1" && -n "${rollback_target}" ]]; then
            echo "Cloud Run retained an unsupported legacy rollback target." >&2
            exit 1
          fi
          trap - EXIT

      - name: Open general traffic after rollout succeeds
        if: steps.stable.outputs.public_traffic_enabled != 'true'
        shell: bash
        timeout-minutes: 15
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.digest }}
          NEW_REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          set -euo pipefail
          apply_edge() {
            terraform -chdir="${TF_ROOT}" apply \
              -lock-timeout=5m \
              -auto-approve \
              -target=google_compute_security_policy.api \
              -var="project_id=${GCP_PROJECT_ID}" \
              -var="region=${GCP_REGION}" \
              -var="environment=staging" \
              -var="api_domain=${API_DOMAIN}" \
              -var="frontend_origin=${FRONTEND_ORIGIN}" \
              -var="media_bucket_name=${MEDIA_BUCKET_NAME}" \
              -var="artifact_repository_id=${ARTIFACT_REPOSITORY}" \
              -var="container_image=${CONTAINER_IMAGE}" \
              -var="cloud_sql_instance_id=${CLOUD_SQL_SOURCE_INSTANCE}" \
              -var="api_max_instances=2" \
              -var="database_connection_alert_threshold=18" \
              -var="media_retention_days=${MEDIA_RETENTION_DAYS}" \
              -var="public_traffic_enabled=$1"
          }
          restore_closed_edge() {
            apply_edge false || echo "Failed to restore the closed edge." >&2
          }
          trap restore_closed_edge EXIT
          apply_edge true
          edge_ready=0
          for _ in {1..30}; do
            edge_action="$(gcloud compute security-policies rules describe 2147483647 \
              --security-policy "${SERVICE}-armor" \
              --project "${GCP_PROJECT_ID}" \
              --format='value(action)' 2>/dev/null || true)"
            response="$(curl --connect-timeout 2 --max-time 3 --fail --silent --show-error \
              "https://${API_DOMAIN}/edgez" 2>/dev/null || true)"
            revision="$(jq -r 'select(.status == "ok" and .runtime == "api") | .revision // empty' \
              <<< "${response}" 2>/dev/null || true)"
            if [[ "${edge_action}" == "allow" && "${revision}" == "${NEW_REVISION}" ]]; then
              edge_ready=1
              break
            fi
            sleep 10
          done
          if (( edge_ready == 0 )); then
            echo "Cloud Armor or the public edge did not expose the promoted API revision (action=${edge_action:-unavailable}, revision=${revision:-unavailable})." >&2
            exit 1
          fi
          trap - EXIT

      - name: Restore stable traffic after a failed rollout
        if: (failure() || cancelled()) && steps.stable.outputs.revision != ''
        shell: bash
        env:
          STABLE_REVISION: ${{ steps.stable.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --to-revisions "${STABLE_REVISION}=100" \
            --quiet
          current_rollback_target="$(gcloud run services describe "${SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format=json \
            | jq -r '[.status.traffic[] | select(.tag == "rollback-target") | .revisionName][0] // empty')"
          if [[ -n "${current_rollback_target}" ]]; then
            gcloud run services update-traffic "${SERVICE}" \
              --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
              --remove-tags rollback-target --quiet
          fi
          restored="$(gcloud run services describe "${SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format=json \
            | jq -r '[.status.traffic[] | select((.percent // 0) == 100) | .revisionName][0] // empty')"
          if [[ "${restored}" != "${STABLE_REVISION}" ]]; then
            echo "Cloud Run did not confirm restoration of the stable revision." >&2
            exit 1
          fi
          echo "Staging traffic was restored to ${STABLE_REVISION}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Record deployment result
        if: success()
        shell: bash
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.digest }}
          NEW_REVISION: ${{ steps.revision.outputs.revision }}
          READINESS_CONTRACT: ${{ steps.stable.outputs.readiness_contract }}
          STABLE_REVISION: ${{ steps.stable.outputs.revision }}
        run: |
          load_balancer_ip="$(terraform -chdir="${TF_ROOT}" output -raw api_load_balancer_ip)"
          rollback_target="none"
          if [[ "${READINESS_CONTRACT}" == "v1" \
            && -n "${STABLE_REVISION}" \
            && "${NEW_REVISION}" != "${STABLE_REVISION}" ]]; then
            rollback_target="${STABLE_REVISION}"
          fi
          {
            echo "### Staging deployment"
            echo "- Source: ${SOURCE_SHA}"
            echo "- Image: ${CONTAINER_IMAGE}"
            echo "- Revision: ${NEW_REVISION}"
            echo "- Previous stable revision: ${STABLE_REVISION:-none}"
            echo "- Rollback target: ${rollback_target}"
            echo "- Public endpoint: https://${API_DOMAIN}"
            echo "- DNS target: ${load_balancer_ip}"
          } >> "${GITHUB_STEP_SUMMARY}"
