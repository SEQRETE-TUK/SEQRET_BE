name: Deploy staging infrastructure

on:
  workflow_dispatch:
    inputs:
      container_image:
        description: Immutable Artifact Registry image reference ending in @sha256:<digest>
        required: true
        type: string
      apply:
        description: Generate a fresh plan and apply it in the same run
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ROOT: infrastructure/terraform
  TF_STATE_PREFIX: seqret/staging
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  CONTAINER_IMAGE: ${{ inputs.container_image }}

jobs:
  plan-and-deploy:
    name: Plan and optionally apply staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          required_variables=(
            GCP_PROJECT_ID
            GCP_REGION
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_DEPLOY_SERVICE_ACCOUNT
            TF_STATE_BUCKET
          )
          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Required GitHub variable ${variable_name} is not configured." >&2
              exit 1
            fi
          done
          if [[ ! "${CONTAINER_IMAGE}" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "container_image must be pinned by sha256 digest." >&2
            exit 1
          fi

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < "${TF_ROOT}/.terraform-version")" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Initialize remote state
        run: >-
          terraform -chdir="${TF_ROOT}" init
          -input=false
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="prefix=${TF_STATE_PREFIX}"

      - name: Check formatting and configuration
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_ROOT}" fmt -check -recursive
          terraform -chdir="${TF_ROOT}" validate

      - name: Create staging plan
        run: >-
          terraform -chdir="${TF_ROOT}" plan
          -lock-timeout=5m
          -out="${RUNNER_TEMP}/staging.tfplan"
          -var="project_id=${GCP_PROJECT_ID}"
          -var="region=${GCP_REGION}"
          -var="environment=staging"
          -var="container_image=${CONTAINER_IMAGE}"

      - name: Apply generated staging plan
        if: inputs.apply
        run: >-
          terraform -chdir="${TF_ROOT}" apply
          -lock-timeout=5m
          -auto-approve
          "${RUNNER_TEMP}/staging.tfplan"

      - name: Record plan-only result
        if: ${{ !inputs.apply }}
        run: echo "Plan completed without apply. Re-run with apply=true after review." >> "${GITHUB_STEP_SUMMARY}"
